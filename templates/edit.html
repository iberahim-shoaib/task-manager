
<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>
    <h1>Edit Task</h1>

    <form method="POST">
        <label>Title</label>
        <input type="text" name="title"
               value="{{ task.title }}" maxlength="200" required>

        <p>Description</p>
        <textarea name="description">{{ task.description or '' }}</textarea>

        <p>Priority</p>
        <select name="priority">
            <option value="Low"
                {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
            <option value="Medium"
                {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="High"
                {% if task.priority == 'High' %}selected{% endif %}>High</option>
        </select>

        <p>Due date</p>
        <input type="date" name="due_date"
               value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="/">Back to Task Manager</a></p>
</body>
</html>
